<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>spell-blade</title>
  <defs>
    <linearGradient id="sb-blade" x1="16%" y1="0%" x2="84%" y2="100%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".26" stop-color="#eaf8ff"/>
      <stop offset=".52" stop-color="#b9d4ff"/>
      <stop offset=".72" stop-color="#8ea6f0"/>
      <stop offset="1" stop-color="#5a4ad8"/>
    </linearGradient>
    <linearGradient id="sb-hilt" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset=".3" stop-color="#ffe066"/>
      <stop offset=".66" stop-color="#d68a1c"/>
      <stop offset="1" stop-color="#8a4f0e"/>
    </linearGradient>
    <radialGradient id="sb-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b49bff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#74e4ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#74e4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sb-rough" x="-16%" y="-16%" width="132%" height="132%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sb-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="60" r="54" fill="url(#sb-aura)"/>
  <g filter="url(#sb-rough)">
    <!-- blade -->
    <path d="M64,6 L78,32 L76,84 L64,94 L52,84 L50,32 Z" fill="url(#sb-blade)" stroke="#1b1220" stroke-width="7" stroke-linejoin="round"/>
    <path d="M64,14 L64,88" stroke="#ffffff" stroke-width="4" opacity=".85"/>
    <path d="M64,20 L70,34 L70,78" stroke="#ffffff" stroke-width="2.6" opacity=".45"/>
    <!-- rune on blade -->
    <path d="M64,44 L72,56 L64,68 L56,56 Z" fill="#74e4ff" opacity=".9"/>
    <path d="M64,48 L68,56 L64,64 L60,56 Z" fill="#ffffff" opacity=".8"/>
    <!-- guard -->
    <path d="M30,88 C40,80 52,76 64,76 C76,76 88,80 98,88 C88,96 76,100 64,100 C52,100 40,96 30,88 Z" fill="url(#sb-hilt)" stroke="#1b1220" stroke-width="7" stroke-linejoin="round"/>
    <path d="M40,86 C50,81 58,79 64,79" stroke="#fffbe0" stroke-width="4" opacity=".8" fill="none" stroke-linecap="round"/>
    <!-- grip + pommel -->
    <path d="M58,100 L70,100 L70,116 L58,116 Z" fill="#4a2160" stroke="#1b1220" stroke-width="6" stroke-linejoin="round"/>
    <path d="M60,102 L60,114 M64,102 L64,114 M68,102 L68,114" stroke="#b49bff" stroke-width="2.6" opacity=".7"/>
    <circle cx="64" cy="120" r="6" fill="url(#sb-hilt)" stroke="#1b1220" stroke-width="5"/>
  </g>
  <g fill="#eaf8ff" filter="url(#sb-glow)">
    <path d="M24,42 l2.4,5.6 5.6,2.4 -5.6,2.4 -2.4,5.6 -2.4,-5.6 -5.6,-2.4 5.6,-2.4 Z" opacity=".85"/>
    <path d="M106,56 l2,4.6 4.6,2 -4.6,2 -2,4.6 -2,-4.6 -4.6,-2 4.6,-2 Z" opacity=".75"/>
    <circle cx="98" cy="24" r="3.2" opacity=".8"/>
  </g>
</svg>
