<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>spell-frost</title>
  <defs>
    <linearGradient id="sx-moon" x1="16%" y1="0%" x2="86%" y2="100%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#e2fbff"/>
      <stop offset=".62" stop-color="#74e4ff"/>
      <stop offset=".84" stop-color="#3fa8e8"/>
      <stop offset="1" stop-color="#2a4fc0"/>
    </linearGradient>
    <linearGradient id="sx-shard" x1="30%" y1="0%" x2="74%" y2="100%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c9f8ff"/>
      <stop offset="1" stop-color="#4b8dff"/>
    </linearGradient>
    <filter id="sx-rough" x="-16%" y="-16%" width="132%" height="132%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sx-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sx-glow)" opacity=".5">
    <circle cx="64" cy="64" r="44" fill="#74e4ff"/>
  </g>
  <g filter="url(#sx-rough)">
    <!-- crescent moon shard -->
    <path d="M86,20 C60,26 40,48 40,76 C40,96 52,112 68,118 C42,116 16,96 14,66 C12,38 40,14 68,14 C76,14 82,16 86,20 Z" fill="url(#sx-moon)" stroke="#1b1220" stroke-width="7" stroke-linejoin="round"/>
    <path d="M78,32 C58,40 44,58 44,80 C44,94 50,104 60,110" fill="none" stroke="#ffffff" stroke-width="5" opacity=".8" stroke-linecap="round"/>
    <path d="M68,50 C56,58 50,68 50,80" fill="none" stroke="#ffffff" stroke-width="3" opacity=".5" stroke-linecap="round"/>
    <!-- crystal shards -->
    <path d="M94,30 L112,22 L116,44 L98,52 Z" fill="url(#sx-shard)" stroke="#1b1220" stroke-width="6" stroke-linejoin="round"/>
    <path d="M100,78 L118,80 L112,100 L94,94 Z" fill="url(#sx-shard)" stroke="#1b1220" stroke-width="6" stroke-linejoin="round"/>
    <path d="M100,36 L107,30" stroke="#ffffff" stroke-width="4" opacity=".8" stroke-linecap="round"/>
  </g>
  <g fill="#e2fbff">
    <path d="M24,28 l2.4,5.6 5.6,2.4 -5.6,2.4 -2.4,5.6 -2.4,-5.6 -5.6,-2.4 5.6,-2.4 Z"/>
    <path d="M40,116 l2,4.4 4.4,2 -4.4,2 -2,4.4 -2,-4.4 -4.4,-2 4.4,-2 Z" opacity=".8"/>
  </g>
</svg>
