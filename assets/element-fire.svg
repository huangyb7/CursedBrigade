<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>element-fire</title>
  <defs>
    <linearGradient id="ef-flame" x1="26%" y1="100%" x2="76%" y2="0%">
      <stop offset="0" stop-color="#a8182c"/>
      <stop offset=".18" stop-color="#e8392c"/>
      <stop offset=".42" stop-color="#ff6b3d"/>
      <stop offset=".66" stop-color="#ffb143"/>
      <stop offset=".85" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#fff4d8"/>
