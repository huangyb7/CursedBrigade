    <path d="M64,4 C70,26 86,38 92,56 C100,78 88,108 64,112 C40,116 22,96 27,74 C30,58 44,50 46,32 C52,48 60,54 64,46 C68,38 60,22 64,4 Z" fill="#ff6b3d"/>
