<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>element-acid</title>
  <defs>
    <radialGradient id="ea-drop" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#f6ffe0"/>
      <stop offset=".26" stop-color="#e2ffad"/>
      <stop offset=".58" stop-color="#abff5c"/>
      <stop offset=".82" stop-color="#6ad02f"/>
      <stop offset="1" stop-color="#2f7a24"/>
    </radialGradient>
    <filter id="ea-rough" x="-16%" y="-16%" width="132%" height="132%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="ea-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ea-glow)" opacity=".5">
    <path d="M64,16 C84,44 100,62 100,82 C100,102 84,118 64,118 C44,118 28,102 28,82 C28,62 44,44 64,16 Z" fill="#abff5c"/>
  </g>
  <g filter="url(#ea-rough)">
    <path d="M64,16 C84,44 100,62 100,82 C100,102 84,118 64,118 C44,118 28,102 28,82 C28,62 44,44 64,16 Z" fill="url(#ea-drop)" stroke="#1b1220" stroke-width="7" stroke-linejoin="round"/>
    <ellipse cx="50" cy="76" rx="11" ry="16" fill="#ffffff" opacity=".55" transform="rotate(-22 50 76)"/>
    <ellipse cx="76" cy="96" rx="7" ry="9" fill="#f6ffe0" opacity=".45"/>
    <path d="M64,44 C76,62 82,72 82,82" fill="none" stroke="#e2ffad" stroke-width="5" opacity=".6" stroke-linecap="round"/>
    <!-- bubbles inside -->
    <circle cx="54" cy="96" r="6" fill="#e2ffad" opacity=".7"/>
    <circle cx="74" cy="82" r="4.4" fill="#f6ffe0" opacity=".7"/>
  </g>
  <g filter="url(#ea-glow)" opacity=".9">
    <circle cx="104" cy="36" r="8" fill="#c9ff8a" opacity=".8"/>
    <circle cx="94" cy="14" r="4.4" fill="#e2ffad"/>
    <circle cx="24" cy="44" r="5.4" fill="#abff5c" opacity=".8"/>
    <circle cx="30" cy="22" r="3.2" fill="#e2ffad" opacity=".8"/>
  </g>
</svg>
